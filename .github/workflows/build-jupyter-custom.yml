name: Build Jupyter Custom Images

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "images/jupyter-custom/**"
      - ".github/workflows/build-jupyter-custom.yml"

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - name: Build matrix
        id: set-matrix
        run: |
          set -euo pipefail
          matrix="$(python - <<'PY'
          import json
          import pathlib
          import sys

          root = pathlib.Path("images/jupyter-custom")
          items = []
          for dockerfile in sorted(root.glob("*/Dockerfile")):
            name = dockerfile.parent.name
            base_image = None
            for line in dockerfile.read_text().splitlines():
              if line.startswith("ARG BASE_IMAGE="):
                base_image = line.split("=", 1)[1].strip()
                break
            if not base_image:
              print(f"Skipping {dockerfile}: missing ARG BASE_IMAGE", file=sys.stderr)
              continue
            before, sep, after = base_image.rpartition(":")
            if sep and "/" in before:
              base_image = f"{before}:latest"
            items.append({
              "name": name,
              "dockerfile": str(dockerfile),
              "base_image": base_image,
            })

          print(json.dumps({"include": items}))
          PY
          )"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build:
    runs-on: ubuntu-latest
    needs: matrix
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image name
        id: names
        run: |
          OWNER="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          REPO="$(echo '${{ github.repository }}' | cut -d/ -f2 | tr '[:upper:]' '[:lower:]')"
          echo "image=ghcr.io/$OWNER/$REPO/${{ matrix.name }}" >> "$GITHUB_OUTPUT"

      - name: Build & Push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-args: |
            BASE_IMAGE=${{ matrix.base_image }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.names.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
