# .github/workflows/build-desktop.yml
name: Build Selkies Desktop Coder Image

on:
  workflow_dispatch:
    inputs:
      selkies_tag:
        description: 'Selkies glx-desktop tag (e.g. 26.04)'
        required: false
        default: '26.04'
  push:
    branches: [ main ]
    paths:
      - "images/desktop/**"
      - ".github/workflows/build-desktop.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image name
        id: names
        run: |
          OWNER="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          REPO="$(echo '${{ github.repository }}' | cut -d/ -f2 | tr '[:upper:]' '[:lower:]')"
          echo "image=ghcr.io/$OWNER/$REPO/desktop" >> "$GITHUB_OUTPUT"

      - name: Build & Push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: images/desktop/Dockerfile
          build-args: |
            BASE_IMAGE=ghcr.io/selkies-project/selkies-glx-desktop:${{ inputs.selkies_tag || vars.SELKIES_TAG || '26.04' }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.names.outputs.image }}:latest
            ${{ steps.names.outputs.image }}:${{ inputs.selkies_tag || vars.SELKIES_TAG || '26.04' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
