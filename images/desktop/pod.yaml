# Example Kubernetes manifest for the Selkies GLX desktop image.
# Requires an NVIDIA GPU node with the NVIDIA device plugin, and the NVIDIA
# container toolkit configured so NVENC + GLX reach the container.
# NOTE: This base is X11-only (no Wayland) and NVIDIA-GLX. For non-NVIDIA GPUs
# or GPU sharing, build on ghcr.io/selkies-project/selkies-egl-desktop instead.
apiVersion: v1
kind: Secret
metadata:
  name: coder-desktop-auth
type: Opaque
stringData:
  passwd: mypasswd
---
apiVersion: v1
kind: Pod
metadata:
  name: coder-desktop
  labels:
    app: coder-desktop
spec:
  restartPolicy: Never
  containers:
    - name: desktop
      image: ghcr.io/sdsu-research-ci/coder-images/desktop:2026-09-dev-v0.0.1
      imagePullPolicy: IfNotPresent
      ports:
        - containerPort: 8080
          name: http
          protocol: TCP
      env:
        - name: TZ
          value: UTC
        # The account is renamed ubuntu -> coder in the image (see Dockerfile).
        # `USER` still feeds the base entrypoint's `chpasswd` target.
        - name: USER
          value: coder
        - name: PASSWD
          valueFrom:
            secretKeyRef:
              name: coder-desktop-auth
              key: passwd
        # IMPORTANT: do NOT enable Selkies HTTP Basic auth for browser clients.
        # Browsers do not attach cached Basic credentials to WebSocket handshakes
        # (and Coder's workspace proxy cannot inject an Authorization header it
        # never received either), so the streaming WS to /api/websockets returns
        # 401 and the desktop closes right after the page loads. In this topology
        # access control is Coder's job (coder_app share = owner/authenticated)
        # or an Ingress in front of the Service; Selkies must not layer its own.
        - name: SELKIES_ENABLE_BASIC_AUTH
          value: "false"
        # Selkies serves HTTPS by default on a self-signed cert. The Service in
        # front of this pod is plain HTTP; terminate TLS upstream (or flip this
        # to "true" and mount a real cert via SELKIES_HTTPS_CERT/SELKIES_HTTPS_KEY).
        - name: SELKIES_ENABLE_HTTPS
          value: "false"
        - name: SELKIES_MODE
          value: websockets
        # X server initial mode. Dynamic resizing is on by default, so these are
        # only the boot geometry; the client's size wins once connected.
        - name: DISPLAY_SIZEW
          value: "1920"
        - name: DISPLAY_SIZEH
          value: "1080"
        - name: DISPLAY_REFRESH
          value: "60"
        - name: DISPLAY_CDEPTH
          value: "24"
        # NVIDIA video port to report a monitor on; keeps RandR outputs alive.
        - name: VIDEO_PORT
          value: DFP
        # NOTE: Selkies v2 encoder names are `h264enc` (default, NVENC/VA-API with
        # software fallback), `h264enc-striped`, and `jpeg`. The old `nvh264enc`
        # is no longer valid and would just log a warning and fall back to h264enc,
        # so we omit it. Encoder / bitrate / framerate / DPI are chosen per-client
        # from the web dashboard.
        # Hardening option (Secure Mode): set SELKIES_MASTER_TOKEN here and pass
        # it as ?token=... from the Coder app URL; see docs.selkies.io/latest/secure-mode.
      resources:
        # Override the namespace LimitRange defaults (which cap this container at
        # cpu=100m / memory=1Gi). 100m throttles kwin + the X server + Selkies
        # capture/encode hard enough to make the desktop feel laggy. Give it real
        # CPU; memory request also lets the scheduler place it on a node with room.
        requests:
          cpu: "2"
          memory: 4Gi
        limits:
          cpu: "6"
          memory: 12Gi
          nvidia.com/gpu: "1"
      volumeMounts:
        - name: home
          mountPath: /home/coder
        - name: dshm
          mountPath: /dev/shm
  volumes:
    # Persist the session user's home (KDE settings, proot-apps, Steam/Wine).
    - name: home
      emptyDir: {}
    - name: dshm
      emptyDir:
        medium: Memory
        sizeLimit: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: coder-desktop
spec:
  selector:
    app: coder-desktop
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
  type: ClusterIP
